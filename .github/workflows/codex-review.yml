name: Codex review

# Reviews the pull-request diff with Codex and reports the `Codex Code Review`
# check. It runs for a comment with a `/codex-review` line, posted by gizlet-bot
# when the pull request is opened or updated, or by a writer to review again.
# Runs on GitHub-hosted runners and never executes pull-request code.
# See https://github.com/gizlet/.github.

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: Open pull request to review.
        required: false
        default: ''
        type: string
      head_sha:
        description: Expected pull-request head; a moved head is skipped.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  review:
    # Every new comment starts this workflow; only one with a /codex-review line goes on.
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.pull_request_number != '')
      || (github.event_name == 'issue_comment' && github.event.issue.pull_request
          && contains(github.event.comment.body, '/codex-review'))
    concurrency:
      group: codex-review-${{ inputs.pull_request_number || github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      checks: write
      contents: read
      issues: write
      pull-requests: write
    uses: gizlet/.github/.github/workflows/codex-review.yml@latest
    with:
      pull_request_number: ${{ inputs.pull_request_number }}
      head_sha: ${{ inputs.head_sha }}
      review-instructions: >-
        Models Viewer is a 3D model gallery for Gizlet handhelds (R36S: Mali-G31
        through Panfrost, OpenGL ES 3 or 2, 640x480) in Rust + raylib, with its
        own glTF loading, GPU skinning and shaders over rlgl. Focus on
        correctness, input handling, GPU and CPU cost on low-end ARM hardware,
        GLSL ES 1.00/3.00 compatibility, unsafe FFI use with raylib, and that
        every bundled model keeps its credits and an open license. Models,
        thumbnails, fonts and Store art are binary files in Git, so the diff
        shows only that they changed; that is expected and not a finding.
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
